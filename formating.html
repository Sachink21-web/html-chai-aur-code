<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Formatting </h1>
    <h2> this is <b> important </b> </h2> 
    <p>this is <b> important </b></p>
    <p>this is <strong> important </strong></p>
    <p>this is <i> important </i></p>
    <p>this is <em> important </em></p>

    <ul>
        <li>b; strong</li>
        <li>i; em</li>
        <li>small</li>
        <li>sub , sup</li>
        <li>del , mark</li>
    </ul>

    <p> the formula of glucose is C<sub>6</sub>H<sub>12</sub>O<sub>6</sub></p>
    <p>discounted price <del>10000</del> is <mark>7999</mark></p>
<h3 style="align-items: center; background-color: yellow;"> This is styling tag</h3>
</body>
</html>
