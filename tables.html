<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table{
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            color: #000000;
        }
        td, th{
            border: 1px solid black;
            padding: 10px;
        }
        tr:nth-child(even) {
            background-color: #786f6f;
        }
    </style>
</head>
<body>
    <table>

        <tr>

            <th>country</th>
            <th>code</th>
            <th>email</th>
        
            <tr>

            <td>United states of America</td>
            <td>USA</td>
            <td>usa@gmail.com</td>
        
        </tr>

        <tr>
            <td>India</td>
            <td>IN</td>
            <td>IN@gmail.com</td>
        
        </tr>

        <tr>
            <td>Russia</td>
            <td>RS</td>
            <td>RS@gmail.com</td>
        
        </tr>

    </table>
</body>
</html>
